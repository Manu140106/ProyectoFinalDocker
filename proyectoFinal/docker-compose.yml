version: "3.8"

services:

  db:
    image: mysql:8.0
    container_name: db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: university
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass123
    volumes:
      - db-data:/var/lib/mysql
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      universidad-net:
        ipv4_address: 172.20.0.2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  java-service:
    build:
      context: ./java-service
      dockerfile: Dockerfile
    container_name: java-service
    restart: on-failure
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: university
      DB_USER: appuser
      DB_PASSWORD: apppass123
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      universidad-net:
        ipv4_address: 172.20.0.3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/students || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: python-service
    restart: on-failure
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: university
      DB_USER: appuser
      DB_PASSWORD: apppass123
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      universidad-net:
        ipv4_address: 172.20.0.4
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/stats')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  node-service:
    build:
      context: ./node-service
      dockerfile: Dockerfile
    container_name: node-service
    restart: on-failure
    environment:
      JAVA_SERVICE: java-service
      PYTHON_SERVICE: python-service
    ports:
      - "3000:3000"
    depends_on:
      java-service:
        condition: service_healthy
      python-service:
        condition: service_healthy
    networks:
      universidad-net:
        ipv4_address: 172.20.0.5

volumes:
  db-data:

networks:
  universidad-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
